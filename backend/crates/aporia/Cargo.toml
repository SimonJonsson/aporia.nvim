[package]
name = "aporia"
description = "aporia backend process; Neovim starts it and talks msgpack-RPC over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aporia-core = { path = "../aporia-core" }
async-trait = "0.1.92"
futures-util = "0.3.34"
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
reqwest = { version = "0.13.5", features = ["stream"] }
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
